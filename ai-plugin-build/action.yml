name: 'Build ToolHive AI Plugin'
description: 'Build and optionally push an AI-tool plugin as an OCI artifact'
author: 'Stacklok'
branding:
  icon: 'package'
  color: 'purple'

inputs:
  path:
    description: 'Path to the AI-tool plugin directory containing .claude-plugin/plugin.json'
    required: true
  tags:
    description: 'Newline-delimited complete OCI references. Blank lines are ignored and surrounding whitespace is trimmed.'
    required: false
    default: ''
  push:
    description: "Push every built artifact to a remote OCI registry. Accepts exactly 'true' or 'false'; requires prior registry login."
    required: false
    default: 'false'

outputs:
  reference:
    description: 'First OCI reference built by the action'
    value: ${{ steps.build.outputs.reference }}
  references:
    description: 'Newline-delimited OCI references built by the action, in input order'
    value: ${{ steps.build.outputs.references }}

runs:
  using: 'composite'
  steps:
    - name: Check Inputs and Prerequisites
      shell: bash
      env:
        INPUT_PATH: ${{ inputs.path }}
        INPUT_TAGS: ${{ inputs.tags }}
        INPUT_PUSH: ${{ inputs.push }}
      run: |
        shopt -s extglob
        case "$INPUT_PUSH" in
          true|false) ;;
          *)
            echo "::error::The 'push' input must be exactly push: 'true' or push: 'false'."
            exit 1
            ;;
        esac

        TAG_REFERENCES=()
        while IFS= read -r LINE || [ -n "$LINE" ]; do
          REFERENCE="${LINE##+([[:space:]])}"
          REFERENCE="${REFERENCE%%+([[:space:]])}"
          [ -z "$REFERENCE" ] && continue

          for EXISTING_REFERENCE in "${TAG_REFERENCES[@]}"; do
            if [ "$REFERENCE" = "$EXISTING_REFERENCE" ]; then
              echo "::error::The 'tags' input contains a duplicate OCI reference."
              exit 1
            fi
          done
          TAG_REFERENCES+=("$REFERENCE")
        done <<< "$INPUT_TAGS"

        # The validation target list holds one tab-separated directory per line.
        case "$INPUT_PATH" in
          *$'\t'* | *$'\n'*)
            echo "::error::The 'path' input must not contain a tab or line break."
            exit 1
            ;;
        esac

        if ! command -v thv &> /dev/null; then
          echo "::error::ToolHive CLI (thv) is not installed. Please use the install action first."
          exit 1
        fi

        if [ ! -d "$INPUT_PATH" ]; then
          echo "::error::AI-tool plugin directory not found: $INPUT_PATH"
          exit 1
        fi

        if [ ! -f "$INPUT_PATH/.claude-plugin/plugin.json" ]; then
          echo "::error::.claude-plugin/plugin.json not found in $INPUT_PATH"
          exit 1
        fi

        if ! command -v jq &> /dev/null; then
          echo "::error::jq is required to read validation results."
          exit 1
        fi

        # Pushing signs with the job's OIDC token, and without one thv refuses
        # to sign; fail now, before building, with a clearer message.
        if [ "$INPUT_PUSH" = "true" ]; then
          bash "$GITHUB_ACTION_PATH/../lib/build.sh" require-oidc
        fi

    - name: Start ToolHive Daemon
      id: daemon
      shell: bash
      env:
        INPUT_PUSH: ${{ inputs.push }}
      # Pushing sends the job's OIDC token to the API server, so it never
      # goes to a server that this action did not start.
      run: |
        if [ "$INPUT_PUSH" = "true" ]; then
          bash "$GITHUB_ACTION_PATH/../lib/daemon.sh" start --owned
        else
          bash "$GITHUB_ACTION_PATH/../lib/daemon.sh" start
        fi

    - name: Validate AI Plugin
      shell: bash
      env:
        TOOLHIVE_API_URL: ${{ steps.daemon.outputs.url }}
        INPUT_PATH: ${{ inputs.path }}
        INPUT_FAIL_ON_WARNINGS: 'false'
      # skill-validate's script annotates findings on their file and line. It
      # reads the directory from a target list.
      run: |
        WORK_DIR=$(mktemp -d "${RUNNER_TEMP:-${TMPDIR:-/tmp}}/toolhive-validate.XXXXXX")
        printf '%s\t%s\n' plugin "$INPUT_PATH" > "$WORK_DIR/targets.tsv"
        WORK_DIR="$WORK_DIR" bash "$GITHUB_ACTION_PATH/../skill-validate/validate.sh" validate

    - name: Build AI Plugin
      id: build
      shell: bash
      env:
        TOOLHIVE_API_URL: ${{ steps.daemon.outputs.url }}
        INPUT_PATH: ${{ inputs.path }}
        INPUT_TAGS: ${{ inputs.tags }}
      run: |
        set -o pipefail
        shopt -s extglob
        TAG_REFERENCES=()
        while IFS= read -r LINE || [ -n "$LINE" ]; do
          TAG_REFERENCE="${LINE##+([[:space:]])}"
          TAG_REFERENCE="${TAG_REFERENCE%%+([[:space:]])}"
          [ -n "$TAG_REFERENCE" ] && TAG_REFERENCES+=("$TAG_REFERENCE")
        done <<< "$INPUT_TAGS"

        # Command substitution, not process substitution, so a failed build
        # fails this step.
        BUILT=$(bash "$GITHUB_ACTION_PATH/../lib/build.sh" build ai-plugin "$INPUT_PATH" \
          ${TAG_REFERENCES[@]+"${TAG_REFERENCES[@]}"})
        BUILT_REFERENCES=()
        while IFS= read -r REFERENCE; do
          BUILT_REFERENCES+=("$REFERENCE")
        done <<< "$BUILT"

        write_multiline_output() {
          local NAME="$1"
          shift
          local DELIMITER="ghadelimiter_${RANDOM}_${RANDOM}_$$"
          while printf '%s\n' "$@" | grep -Fqx -- "$DELIMITER"; do
            DELIMITER="${DELIMITER}_"
          done
          {
            echo "${NAME}<<${DELIMITER}"
            printf '%s\n' "$@"
            echo "$DELIMITER"
          } >> "$GITHUB_OUTPUT"
        }

        printf 'reference=%s\n' "${BUILT_REFERENCES[0]}" >> "$GITHUB_OUTPUT"
        write_multiline_output references "${BUILT_REFERENCES[@]}"

    - name: Push AI Plugins
      if: inputs.push == 'true'
      shell: bash
      env:
        TOOLHIVE_API_URL: ${{ steps.daemon.outputs.url }}
        REFERENCES: ${{ steps.build.outputs.references }}
      run: |
        PUSH_REFERENCES=()
        while IFS= read -r REFERENCE || [ -n "$REFERENCE" ]; do
          [ -n "$REFERENCE" ] && PUSH_REFERENCES+=("$REFERENCE")
        done <<< "$REFERENCES"
        bash "$GITHUB_ACTION_PATH/../lib/build.sh" push ai-plugin "${PUSH_REFERENCES[@]}"

    - name: Stop ToolHive Daemon
      if: always() && steps.daemon.outputs.started == 'true'
      shell: bash
      env:
        DAEMON_PID: ${{ steps.daemon.outputs.pid }}
        DAEMON_STARTED: ${{ steps.daemon.outputs.started }}
      run: bash "$GITHUB_ACTION_PATH/../lib/daemon.sh" stop
