name: Test Actions

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  # Run daily so breakage from upstream ToolHive "latest" releases (e.g. renamed
  # CLI flags or moved API routes) is caught proactively rather than at next push.
  schedule:
    - cron: '0 6 * * *'

jobs:
  test-install-action:
    name: Test Install Action - ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Temporarily disabled: macos-latest, windows-latest
        # See issues #2 and #3
        os: [ubuntu-latest]
        version: [latest, v0.2.5]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      
      - name: Test Install Action
        id: install
        uses: ./install
        with:
          version: ${{ matrix.version }}
      
      - name: Verify Installation
        run: |
          echo "Installed version: ${{ steps.install.outputs.version }}"
          echo "Binary path: ${{ steps.install.outputs.path }}"
          thv version
      
      - name: Test Basic Commands
        run: |
          thv --help
          thv registry list | head -5

  test-run-action:
    name: Test Run Action - ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Temporarily disabled: macos-latest
        # See issue #2
        os: [ubuntu-latest]
        # Windows and macOS runners have issues with container runtime
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      
      - name: Install ToolHive
        uses: ./install
      
      - name: Test Run Action
        id: run-server
        uses: ./run-mcp-server
        with:
          server: fetch
          name: test-server
          wait-for-ready: true
          timeout: 30
      
      - name: Verify Server Running
        run: |
          echo "Server URL: ${{ steps.run-server.outputs.url }}"
          echo "Server Port: ${{ steps.run-server.outputs.port }}"
          echo "Server Status: ${{ steps.run-server.outputs.status }}"
          thv list
      
      - name: Stop Server
        if: always()
        run: thv stop test-server || true

  test-caching:
    name: Test Installation Caching
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      
      - name: First Install (No Cache)
        id: first-install
        uses: ./install
        with:
          version: v0.2.5
      
      - name: Clear Binary (Simulate Cache Miss)
        run: |
          rm -f ~/.toolhive/bin/thv
      
      - name: Second Install (Should Use Cache)
        id: second-install
        uses: ./install
        with:
          version: v0.2.5
      
      - name: Verify Cache Was Used
        run: |
          # Both installs should report the same version
          if [ "${{ steps.first-install.outputs.version }}" != "${{ steps.second-install.outputs.version }}" ]; then
            echo "Cache test failed: versions don't match"
            exit 1
          fi
          thv version

  test-different-transports:
    name: Test Different Transport Methods
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      
      - name: Install ToolHive
        uses: ./install
      
      - name: Test stdio Transport
        uses: ./run-mcp-server
        with:
          server: fetch
          name: stdio-server
          transport: stdio
      
      - name: Stop stdio Server
        run: thv stop stdio-server
      
      - name: Test SSE Transport
        uses: ./run-mcp-server
        with:
          server: fetch
          name: sse-server
          transport: sse
          proxy-port: 8081
        continue-on-error: true  # Some servers might not support all transports
      
      - name: Clean Up
        if: always()
        run: thv stop --all || true

  test-mcp-config-action:
    name: Test MCP Config Action
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install ToolHive
        uses: ./install

      - name: Run Fetch Server
        uses: ./run-mcp-server
        with:
          server: fetch
          name: fetch-test

      - name: Run GitHub Server
        uses: ./run-mcp-server
        with:
          server: github
          name: github-test
        continue-on-error: true  # May fail without credentials

      - name: Test MCP Config Action
        id: config
        uses: ./mcp-config
        with:
          output-file: test-mcp-servers.json
          upload-artifact: 'true'
          artifact-name: test-mcp-config

      - name: Verify Configuration Output
        run: |
          echo "Config file: ${{ steps.config.outputs.config-file }}"
          echo "Server count: ${{ steps.config.outputs.server-count }}"

          # Verify the file exists
          if [ ! -f "${{ steps.config.outputs.config-file }}" ]; then
            echo "Error: Config file not found"
            exit 1
          fi

          # Verify it's valid JSON
          if ! jq empty "${{ steps.config.outputs.config-file }}"; then
            echo "Error: Invalid JSON format"
            exit 1
          fi

          # Display the configuration
          echo "Configuration content:"
          cat "${{ steps.config.outputs.config-file }}"

          echo "✓ MCP config action test passed"

      - name: Clean Up
        if: always()
        run: thv stop --all || true

  test-skill-build-action:
    name: Test Skill Build Action
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install ToolHive
        uses: ./install

      - name: Create Test Skill
        run: |
          mkdir -p test-skill
          cat > test-skill/SKILL.md << 'SKILLEOF'
          ---
          name: test-skill
          description: "A test skill for CI validation"
          version: "0.1.0"
          license: Apache-2.0
          ---

          # Test Skill

          This is a test skill used to validate the skill-build action.
          SKILLEOF

      - name: Test Build Action (default tag)
        id: build
        uses: ./skill-build
        with:
          path: ./test-skill

      - name: Verify Build Output
        env:
          REFERENCE: ${{ steps.build.outputs.reference }}
          REFERENCES: ${{ steps.build.outputs.references }}
        run: |
          echo "Built reference: $REFERENCE"

          if [ -z "$REFERENCE" ]; then
            echo "Error: No reference output from build"
            exit 1
          fi

          if [ "$REFERENCES" != "$REFERENCE" ]; then
            echo "Error: Default build references output does not match reference"
            exit 1
          fi

          echo "Skill build test passed"

      - name: Test Build Action (whitespace-only tags fallback)
        id: build-whitespace-tags
        uses: ./skill-build
        with:
          path: ./test-skill
          tags: '   '

      - name: Verify whitespace-only tags fall back to default build
        env:
          DEFAULT_REFERENCE: ${{ steps.build.outputs.reference }}
          REFERENCE: ${{ steps.build-whitespace-tags.outputs.reference }}
          REFERENCES: ${{ steps.build-whitespace-tags.outputs.references }}
        run: |
          if [ "$REFERENCE" != "$DEFAULT_REFERENCE" ]; then
            echo "Error: Whitespace-only tags did not fall back to the default reference"
            exit 1
          fi

          if [ "$REFERENCES" != "$REFERENCE" ]; then
            echo "Error: Whitespace-only tags references output does not match reference"
            exit 1
          fi

      - name: Test Build Action (custom tag)
        id: build-tagged
        uses: ./skill-build
        with:
          path: ./test-skill
          tag: ghcr.io/stacklok/test-skill:ci

      - name: Verify Tagged Build Output
        env:
          REFERENCE: ${{ steps.build-tagged.outputs.reference }}
          REFERENCES: ${{ steps.build-tagged.outputs.references }}
        run: |
          echo "Built reference: $REFERENCE"

          if [ "$REFERENCE" != "ghcr.io/stacklok/test-skill:ci" ]; then
            echo "Error: Legacy tagged build reference is not ghcr.io/stacklok/test-skill:ci"
            exit 1
          fi

          if [ "$REFERENCES" != "ghcr.io/stacklok/test-skill:ci" ]; then
            echo "Error: Legacy tagged build references output is not ghcr.io/stacklok/test-skill:ci"
            exit 1
          fi

          echo "Tagged skill build test passed"

      - name: Test Build Action (multiple tags)
        id: build-multiple
        uses: ./skill-build
        with:
          path: ./test-skill
          tags: |
            ghcr.io/stacklok/test-skill:ci-one

              ghcr.io/stacklok/test-skill:ci-two

      - name: Verify Multiple Build Outputs
        env:
          REFERENCE: ${{ steps.build-multiple.outputs.reference }}
          REFERENCES: ${{ steps.build-multiple.outputs.references }}
          EXPECTED_REFERENCES: |-
            ghcr.io/stacklok/test-skill:ci-one
            ghcr.io/stacklok/test-skill:ci-two
        run: |
          echo "Built references:"
          printf '%s\n' "$REFERENCES"

          if [ "$REFERENCE" != "ghcr.io/stacklok/test-skill:ci-one" ]; then
            echo "Error: reference is not the first built reference"
            exit 1
          fi

          if [ "$REFERENCES" != "$EXPECTED_REFERENCES" ]; then
            echo "Error: references output did not preserve trimmed input order"
            exit 1
          fi

          echo "Multiple skill build test passed"

      - name: Start ToolHive Daemon for Build Listing Checks
        id: skill-daemon
        run: |
          PORT=$(python3 -c 'import socket; s=socket.socket(); s.bind(("127.0.0.1",0)); print(s.getsockname()[1]); s.close()')
          DAEMON_URL="http://127.0.0.1:${PORT}"
          thv serve --host 127.0.0.1 --port "$PORT" &
          DAEMON_PID=$!
          echo "pid=$DAEMON_PID" >> "$GITHUB_OUTPUT"
          echo "TOOLHIVE_API_URL=$DAEMON_URL" >> "$GITHUB_ENV"

          for _ in $(seq 1 30); do
            if ! kill -0 "$DAEMON_PID" 2>/dev/null; then
              echo "Error: ToolHive daemon exited unexpectedly"
              wait "$DAEMON_PID" 2>/dev/null
              exit 1
            fi
            HTTP_CODE=$(curl --silent --show-error --connect-timeout 1 --max-time 2 \
              -o /dev/null -w '%{http_code}' "${DAEMON_URL}/health" 2>/dev/null || true)
            if [ "$HTTP_CODE" = "204" ]; then
              exit 0
            fi
            sleep 1
          done

          echo "Error: ToolHive daemon failed to become healthy"
          exit 1

      - name: Verify Multiple Builds Are Listed Locally
        env:
          EXPECTED_FIRST_REFERENCE: ghcr.io/stacklok/test-skill:ci-one
          EXPECTED_SECOND_REFERENCE: ghcr.io/stacklok/test-skill:ci-two
        run: |
          BUILDS=$(thv skill builds --format json)
          printf '%s\n' "$BUILDS"

          # The builds listing is the source of truth for locally built artifacts;
          # match complete JSON string values without depending on its schema.
          for REFERENCE in "$EXPECTED_FIRST_REFERENCE" "$EXPECTED_SECOND_REFERENCE"; do
            if ! printf '%s' "$BUILDS" | grep -Fq '"'$REFERENCE'"'; then
              echo "Error: locally built artifact not found: $REFERENCE"
              exit 1
            fi
          done

          echo "Local multi-tag builds are present"

      - name: Stop Test ToolHive Daemon
        if: always()
        env:
          DAEMON_PID: ${{ steps.skill-daemon.outputs.pid }}
        run: |
          if [ -n "$DAEMON_PID" ]; then
            kill "$DAEMON_PID" 2>/dev/null || true
            wait "$DAEMON_PID" 2>/dev/null || true
          fi

      - name: Reject tag and tags together
        id: conflicting-tags
        continue-on-error: true
        uses: ./skill-build
        with:
          path: ./test-skill
          tag: ghcr.io/stacklok/test-skill:legacy
          tags: ghcr.io/stacklok/test-skill:new

      - name: Verify conflicting inputs are rejected
        env:
          OUTCOME: ${{ steps.conflicting-tags.outcome }}
        run: |
          if [ "$OUTCOME" != "failure" ]; then
            echo "Error: tag and tags were not rejected"
            exit 1
          fi

      - name: Reject duplicate tags
        id: duplicate-tags
        continue-on-error: true
        uses: ./skill-build
        with:
          path: ./test-skill
          tags: |
            ghcr.io/stacklok/test-skill:duplicate
              ghcr.io/stacklok/test-skill:duplicate

      - name: Verify duplicate tags are rejected
        env:
          OUTCOME: ${{ steps.duplicate-tags.outcome }}
        run: |
          if [ "$OUTCOME" != "failure" ]; then
            echo "Error: duplicate tags were not rejected"
            exit 1
          fi

  test-ai-plugin-build-action:
    name: Test AI Plugin Build Action
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install latest ToolHive
        uses: ./install
        with:
          version: latest

      - name: Create Test AI Plugin
        run: |
          mkdir -p test-plugin/.claude-plugin
          cat > test-plugin/.claude-plugin/plugin.json << 'PLUGINJSON'
          {
            "name": "test-plugin",
            "description": "A test AI-tool plugin for CI validation",
            "version": "0.1.0",
            "author": {
              "name": "Stacklok"
            }
          }
          PLUGINJSON

      - name: Verify no ToolHive daemon is prestarted
        run: |
          HTTP_CODE=$(curl --silent --connect-timeout 1 --max-time 2 \
            -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/health 2>/dev/null || true)
          if [ "$HTTP_CODE" != "000" ] || pgrep -f '[t]hv serve' >/dev/null; then
            echo "Error: A ToolHive daemon was running before the lifecycle test"
            exit 1
          fi

      - name: Test Build Action (default reference and owned daemon lifecycle)
        id: plugin-build
        uses: ./ai-plugin-build
        with:
          path: ./test-plugin

      - name: Verify Default Build Output
        env:
          REFERENCE: ${{ steps.plugin-build.outputs.reference }}
          REFERENCES: ${{ steps.plugin-build.outputs.references }}
        run: |
          if [ -z "$REFERENCE" ]; then
            echo "Error: No reference output from default plugin build"
            exit 1
          fi
          if [[ "$REFERENCE" == *$'\n'* || "$REFERENCE" == *$'\r'* ]]; then
            echo "Error: Default plugin reference output contains a line break"
            exit 1
          fi
          if [ "$REFERENCES" != "$REFERENCE" ]; then
            echo "Error: Default plugin references output does not match reference"
            exit 1
          fi
          if pgrep -f '[t]hv serve' >/dev/null; then
            echo "Error: Default plugin build did not clean up its action-owned daemon"
            exit 1
          fi

      - name: Reject invalid push value during prerequisites
        id: invalid-plugin-push
        continue-on-error: true
        uses: ./ai-plugin-build
        with:
          path: ./test-plugin
          push: 'TRUE'

      - name: Verify invalid push value is rejected
        env:
          OUTCOME: ${{ steps.invalid-plugin-push.outcome }}
        run: |
          if [ "$OUTCOME" != "failure" ]; then
            echo "Error: Invalid plugin push value was not rejected"
            exit 1
          fi

      - name: Start ToolHive Daemon for Build Listing Checks
        id: plugin-daemon
        run: |
          PORT=$(python3 -c 'import socket; s=socket.socket(); s.bind(("127.0.0.1",0)); print(s.getsockname()[1]); s.close()')
          DAEMON_URL="http://127.0.0.1:${PORT}"
          thv serve --host 127.0.0.1 --port "$PORT" &
          DAEMON_PID=$!
          echo "pid=$DAEMON_PID" >> "$GITHUB_OUTPUT"
          echo "TOOLHIVE_API_URL=$DAEMON_URL" >> "$GITHUB_ENV"

          for _ in $(seq 1 30); do
            if ! kill -0 "$DAEMON_PID" 2>/dev/null; then
              echo "Error: ToolHive daemon exited unexpectedly"
              wait "$DAEMON_PID" 2>/dev/null
              exit 1
            fi
            HTTP_CODE=$(curl --silent --show-error --connect-timeout 1 --max-time 2 \
              -o /dev/null -w '%{http_code}' "${DAEMON_URL}/health" 2>/dev/null || true)
            if [ "$HTTP_CODE" = "204" ]; then
              exit 0
            fi
            sleep 1
          done

          echo "Error: ToolHive daemon failed to become healthy"
          exit 1

      - name: Verify Default Build Is Listed by Controlled Daemon
        env:
          REFERENCE: ${{ steps.plugin-build.outputs.reference }}
        run: |
          BUILDS=$(thv ai-plugin builds --format json)
          printf '%s\n' "$BUILDS"
          if ! printf '%s' "$BUILDS" | grep -Fq '"'$REFERENCE'"'; then
            echo "Error: default plugin build not found locally: $REFERENCE"
            exit 1
          fi

      - name: Test Build Action (multiple tags with blank and whitespace-only lines)
        id: plugin-build-multiple
        uses: ./ai-plugin-build
        with:
          path: ./test-plugin
          tags: "   \n\n  ghcr.io/stacklok/test-plugin:ci-one  \n\t \t\n\tghcr.io/stacklok/test-plugin:ci-two\t\n  "

      - name: Verify Multiple Build Outputs and Listing
        env:
          REFERENCE: ${{ steps.plugin-build-multiple.outputs.reference }}
          REFERENCES: ${{ steps.plugin-build-multiple.outputs.references }}
          EXPECTED_REFERENCE: ghcr.io/stacklok/test-plugin:ci-one
          EXPECTED_REFERENCES: |-
            ghcr.io/stacklok/test-plugin:ci-one
            ghcr.io/stacklok/test-plugin:ci-two
        run: |
          if [[ "$REFERENCE" == *$'\n'* || "$REFERENCE" == *$'\r'* ]]; then
            echo "Error: plugin reference output contains a line break"
            exit 1
          fi
          if [ "$REFERENCE" != "$EXPECTED_REFERENCE" ]; then
            echo "Error: plugin reference does not exactly match the first trimmed input reference"
            exit 1
          fi
          if [ "$REFERENCES" != "$EXPECTED_REFERENCES" ]; then
            echo "Error: plugin references did not preserve trimmed input order"
            exit 1
          fi

          BUILDS=$(thv ai-plugin builds --format json)
          printf '%s\n' "$BUILDS"
          while IFS= read -r BUILT_REFERENCE; do
            if ! printf '%s' "$BUILDS" | grep -Fq '"'$BUILT_REFERENCE'"'; then
              echo "Error: plugin build not found locally: $BUILT_REFERENCE"
              exit 1
            fi
          done <<< "$EXPECTED_REFERENCES"

      - name: Reject invalid plugin manifest before build
        id: invalid-plugin-manifest
        continue-on-error: true
        uses: ./ai-plugin-build
        with:
          path: ./ai-plugin-build/testdata/invalid-name
          tags: ghcr.io/stacklok/invalid-plugin:must-not-build

      - name: Verify invalid plugin manifest did not build
        env:
          OUTCOME: ${{ steps.invalid-plugin-manifest.outcome }}
        run: |
          if [ "$OUTCOME" != "failure" ]; then
            echo "Error: Invalid plugin manifest was not rejected"
            exit 1
          fi
          BUILDS=$(thv ai-plugin builds --format json)
          if printf '%s' "$BUILDS" | grep -Fq '"ghcr.io/stacklok/invalid-plugin:must-not-build"'; then
            echo "Error: Invalid plugin manifest was built before rejection"
            exit 1
          fi

      - name: Reject duplicate trimmed plugin tags
        id: duplicate-plugin-tags
        continue-on-error: true
        uses: ./ai-plugin-build
        with:
          path: ./test-plugin
          tags: "  ghcr.io/stacklok/test-plugin:duplicate  \n\tghcr.io/stacklok/test-plugin:duplicate\t"

      - name: Verify duplicate plugin tags are rejected
        env:
          OUTCOME: ${{ steps.duplicate-plugin-tags.outcome }}
        run: |
          if [ "$OUTCOME" != "failure" ]; then
            echo "Error: duplicate trimmed plugin tags were not rejected"
            exit 1
          fi

      - name: Stop Test ToolHive Daemon
        if: always()
        env:
          DAEMON_PID: ${{ steps.plugin-daemon.outputs.pid }}
        run: |
          if [ -n "$DAEMON_PID" ]; then
            kill "$DAEMON_PID" 2>/dev/null || true
            wait "$DAEMON_PID" 2>/dev/null || true
          fi

  validate-action-metadata:
    name: Validate Action Metadata
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup yq
        uses: mikefarah/yq@v4

      - name: Validate install/action.yml
        run: |
          echo "Validating install/action.yml..."
          yq eval '.' install/action.yml > /dev/null
          echo "✓ install/action.yml is valid"

      - name: Validate run-mcp-server/action.yml
        run: |
          echo "Validating run-mcp-server/action.yml..."
          yq eval '.' run-mcp-server/action.yml > /dev/null
          echo "✓ run-mcp-server/action.yml is valid"

      - name: Validate mcp-config/action.yml
        run: |
          echo "Validating mcp-config/action.yml..."
          yq eval '.' mcp-config/action.yml > /dev/null
          echo "✓ mcp-config/action.yml is valid"

      - name: Validate skill-build/action.yml
        run: |
          echo "Validating skill-build/action.yml..."
          yq eval '.' skill-build/action.yml > /dev/null
          echo "✓ skill-build/action.yml is valid"

      - name: Validate ai-plugin-build/action.yml
        run: |
          echo "Validating ai-plugin-build/action.yml..."
          yq eval '.' ai-plugin-build/action.yml > /dev/null
          echo "✓ ai-plugin-build/action.yml is valid"
