name: Test Actions

on:
  push:
    branches: [ main ]
  # All base branches, so stacked pull requests also run the tests.
  pull_request:
  workflow_dispatch:
  # Run daily so breakage from upstream ToolHive "latest" releases (e.g. renamed
  # CLI flags or moved API routes) is caught proactively rather than at next push.
  schedule:
    - cron: '0 6 * * *'

jobs:
  test-install-action:
    name: Test Install Action - ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Temporarily disabled: macos-latest, windows-latest
        # See issues #2 and #3
        os: [ubuntu-latest]
        version: [latest, v0.2.5]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      
      - name: Test Install Action
        id: install
        uses: ./install
        with:
          version: ${{ matrix.version }}
      
      - name: Verify Installation
        run: |
          echo "Installed version: ${{ steps.install.outputs.version }}"
          echo "Binary path: ${{ steps.install.outputs.path }}"
          thv version
      
      - name: Test Basic Commands
        run: |
          thv --help
          thv registry list | head -5

  test-run-action:
    name: Test Run Action - ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Temporarily disabled: macos-latest
        # See issue #2
        os: [ubuntu-latest]
        # Windows and macOS runners have issues with container runtime
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      
      - name: Install ToolHive
        uses: ./install
      
      - name: Test Run Action
        id: run-server
        uses: ./run-mcp-server
        with:
          server: fetch
          name: test-server
          wait-for-ready: true
          timeout: 30
      
      - name: Verify Server Running
        run: |
          echo "Server URL: ${{ steps.run-server.outputs.url }}"
          echo "Server Port: ${{ steps.run-server.outputs.port }}"
          echo "Server Status: ${{ steps.run-server.outputs.status }}"
          thv list
      
      - name: Stop Server
        if: always()
        run: thv stop test-server || true

  test-caching:
    name: Test Installation Caching
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      
      - name: First Install (No Cache)
        id: first-install
        uses: ./install
        with:
          version: v0.2.5
      
      - name: Clear Binary (Simulate Cache Miss)
        run: |
          rm -f ~/.toolhive/bin/thv
      
      - name: Second Install (Should Use Cache)
        id: second-install
        uses: ./install
        with:
          version: v0.2.5
      
      - name: Verify Cache Was Used
        run: |
          # Both installs should report the same version
          if [ "${{ steps.first-install.outputs.version }}" != "${{ steps.second-install.outputs.version }}" ]; then
            echo "Cache test failed: versions don't match"
            exit 1
          fi
          thv version

  test-different-transports:
    name: Test Different Transport Methods
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      
      - name: Install ToolHive
        uses: ./install
      
      - name: Test stdio Transport
        uses: ./run-mcp-server
        with:
          server: fetch
          name: stdio-server
          transport: stdio
      
      - name: Stop stdio Server
        run: thv stop stdio-server
      
      - name: Test SSE Transport
        uses: ./run-mcp-server
        with:
          server: fetch
          name: sse-server
          transport: sse
          proxy-port: 8081
        continue-on-error: true  # Some servers might not support all transports
      
      - name: Clean Up
        if: always()
        run: thv stop --all || true

  test-mcp-config-action:
    name: Test MCP Config Action
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install ToolHive
        uses: ./install

      - name: Run Fetch Server
        uses: ./run-mcp-server
        with:
          server: fetch
          name: fetch-test

      - name: Run GitHub Server
        uses: ./run-mcp-server
        with:
          server: github
          name: github-test
        continue-on-error: true  # May fail without credentials

      - name: Test MCP Config Action
        id: config
        uses: ./mcp-config
        with:
          output-file: test-mcp-servers.json
          upload-artifact: 'true'
          artifact-name: test-mcp-config

      - name: Verify Configuration Output
        run: |
          echo "Config file: ${{ steps.config.outputs.config-file }}"
          echo "Server count: ${{ steps.config.outputs.server-count }}"

          # Verify the file exists
          if [ ! -f "${{ steps.config.outputs.config-file }}" ]; then
            echo "Error: Config file not found"
            exit 1
          fi

          # Verify it's valid JSON
          if ! jq empty "${{ steps.config.outputs.config-file }}"; then
            echo "Error: Invalid JSON format"
            exit 1
          fi

          # Display the configuration
          echo "Configuration content:"
          cat "${{ steps.config.outputs.config-file }}"

          echo "✓ MCP config action test passed"

      - name: Clean Up
        if: always()
        run: thv stop --all || true

  test-skill-build-action:
    name: Test Skill Build Action
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install ToolHive
        uses: ./install

      - name: Create Test Skill
        run: |
          mkdir -p test-skill
          cat > test-skill/SKILL.md << 'SKILLEOF'
          ---
          name: test-skill
          description: "A test skill for CI validation"
          version: "0.1.0"
          license: Apache-2.0
          ---

          # Test Skill

          This is a test skill used to validate the skill-build action.
          SKILLEOF

      - name: Test Build Action (default tag)
        id: build
        uses: ./skill-build
        with:
          path: ./test-skill

      - name: Verify Build Output
        env:
          REFERENCE: ${{ steps.build.outputs.reference }}
          REFERENCES: ${{ steps.build.outputs.references }}
        run: |
          echo "Built reference: $REFERENCE"

          if [ -z "$REFERENCE" ]; then
            echo "Error: No reference output from build"
            exit 1
          fi

          if [ "$REFERENCES" != "$REFERENCE" ]; then
            echo "Error: Default build references output does not match reference"
            exit 1
          fi

          echo "Skill build test passed"

      - name: Test Build Action (whitespace-only tags fallback)
        id: build-whitespace-tags
        uses: ./skill-build
        with:
          path: ./test-skill
          tags: '   '

      - name: Verify whitespace-only tags fall back to default build
        env:
          DEFAULT_REFERENCE: ${{ steps.build.outputs.reference }}
          REFERENCE: ${{ steps.build-whitespace-tags.outputs.reference }}
          REFERENCES: ${{ steps.build-whitespace-tags.outputs.references }}
        run: |
          if [ "$REFERENCE" != "$DEFAULT_REFERENCE" ]; then
            echo "Error: Whitespace-only tags did not fall back to the default reference"
            exit 1
          fi

          if [ "$REFERENCES" != "$REFERENCE" ]; then
            echo "Error: Whitespace-only tags references output does not match reference"
            exit 1
          fi

      - name: Test Build Action (custom tag)
        id: build-tagged
        uses: ./skill-build
        with:
          path: ./test-skill
          tag: ghcr.io/stacklok/test-skill:ci

      - name: Verify Tagged Build Output
        env:
          REFERENCE: ${{ steps.build-tagged.outputs.reference }}
          REFERENCES: ${{ steps.build-tagged.outputs.references }}
        run: |
          echo "Built reference: $REFERENCE"

          if [ "$REFERENCE" != "ghcr.io/stacklok/test-skill:ci" ]; then
            echo "Error: Legacy tagged build reference is not ghcr.io/stacklok/test-skill:ci"
            exit 1
          fi

          if [ "$REFERENCES" != "ghcr.io/stacklok/test-skill:ci" ]; then
            echo "Error: Legacy tagged build references output is not ghcr.io/stacklok/test-skill:ci"
            exit 1
          fi

          echo "Tagged skill build test passed"

      - name: Test Build Action (multiple tags)
        id: build-multiple
        uses: ./skill-build
        with:
          path: ./test-skill
          tags: |
            ghcr.io/stacklok/test-skill:ci-one

              ghcr.io/stacklok/test-skill:ci-two

      - name: Verify Multiple Build Outputs
        env:
          REFERENCE: ${{ steps.build-multiple.outputs.reference }}
          REFERENCES: ${{ steps.build-multiple.outputs.references }}
          EXPECTED_REFERENCES: |-
            ghcr.io/stacklok/test-skill:ci-one
            ghcr.io/stacklok/test-skill:ci-two
        run: |
          echo "Built references:"
          printf '%s\n' "$REFERENCES"

          if [ "$REFERENCE" != "ghcr.io/stacklok/test-skill:ci-one" ]; then
            echo "Error: reference is not the first built reference"
            exit 1
          fi

          if [ "$REFERENCES" != "$EXPECTED_REFERENCES" ]; then
            echo "Error: references output did not preserve trimmed input order"
            exit 1
          fi

          echo "Multiple skill build test passed"

      - name: Start ToolHive Daemon for Build Listing Checks
        id: skill-daemon
        run: bash ./lib/daemon.sh start

      - name: Export Daemon URL for Later Steps
        env:
          DAEMON_URL: ${{ steps.skill-daemon.outputs.url }}
        run: echo "TOOLHIVE_API_URL=$DAEMON_URL" >> "$GITHUB_ENV"

      - name: Verify Multiple Builds Are Listed Locally
        env:
          EXPECTED_FIRST_REFERENCE: ghcr.io/stacklok/test-skill:ci-one
          EXPECTED_SECOND_REFERENCE: ghcr.io/stacklok/test-skill:ci-two
        run: |
          BUILDS=$(thv skill builds --format json)
          printf '%s\n' "$BUILDS"

          # The builds listing is the source of truth for locally built artifacts;
          # match complete JSON string values without depending on its schema.
          for REFERENCE in "$EXPECTED_FIRST_REFERENCE" "$EXPECTED_SECOND_REFERENCE"; do
            if ! printf '%s' "$BUILDS" | grep -Fq '"'$REFERENCE'"'; then
              echo "Error: locally built artifact not found: $REFERENCE"
              exit 1
            fi
          done

          echo "Local multi-tag builds are present"

      - name: Stop Test ToolHive Daemon
        if: always()
        env:
          DAEMON_PID: ${{ steps.skill-daemon.outputs.pid }}
          DAEMON_STARTED: ${{ steps.skill-daemon.outputs.started }}
        run: bash ./lib/daemon.sh stop

      - name: Reject tag and tags together
        id: conflicting-tags
        continue-on-error: true
        uses: ./skill-build
        with:
          path: ./test-skill
          tag: ghcr.io/stacklok/test-skill:legacy
          tags: ghcr.io/stacklok/test-skill:new

      - name: Verify conflicting inputs are rejected
        env:
          OUTCOME: ${{ steps.conflicting-tags.outcome }}
        run: |
          if [ "$OUTCOME" != "failure" ]; then
            echo "Error: tag and tags were not rejected"
            exit 1
          fi

      - name: Reject duplicate tags
        id: duplicate-tags
        continue-on-error: true
        uses: ./skill-build
        with:
          path: ./test-skill
          tags: |
            ghcr.io/stacklok/test-skill:duplicate
              ghcr.io/stacklok/test-skill:duplicate

      - name: Verify duplicate tags are rejected
        env:
          OUTCOME: ${{ steps.duplicate-tags.outcome }}
        run: |
          if [ "$OUTCOME" != "failure" ]; then
            echo "Error: duplicate tags were not rejected"
            exit 1
          fi

  test-ai-plugin-build-action:
    name: Test AI Plugin Build Action
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install latest ToolHive
        uses: ./install
        with:
          version: latest

      - name: Create Test AI Plugin
        run: |
          mkdir -p test-plugin/.claude-plugin
          cat > test-plugin/.claude-plugin/plugin.json << 'PLUGINJSON'
          {
            "name": "test-plugin",
            "description": "A test AI-tool plugin for CI validation",
            "version": "0.1.0",
            "author": {
              "name": "Stacklok"
            }
          }
          PLUGINJSON

      - name: Verify no ToolHive daemon is prestarted
        run: |
          HTTP_CODE=$(curl --silent --connect-timeout 1 --max-time 2 \
            -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/health 2>/dev/null || true)
          if [ "$HTTP_CODE" != "000" ] || pgrep -f '[t]hv serve' >/dev/null; then
            echo "Error: A ToolHive daemon was running before the lifecycle test"
            exit 1
          fi

      - name: Test Build Action (default reference and owned daemon lifecycle)
        id: plugin-build
        uses: ./ai-plugin-build
        with:
          path: ./test-plugin

      - name: Verify Default Build Output
        env:
          REFERENCE: ${{ steps.plugin-build.outputs.reference }}
          REFERENCES: ${{ steps.plugin-build.outputs.references }}
        run: |
          if [ -z "$REFERENCE" ]; then
            echo "Error: No reference output from default plugin build"
            exit 1
          fi
          if [[ "$REFERENCE" == *$'\n'* || "$REFERENCE" == *$'\r'* ]]; then
            echo "Error: Default plugin reference output contains a line break"
            exit 1
          fi
          if [ "$REFERENCES" != "$REFERENCE" ]; then
            echo "Error: Default plugin references output does not match reference"
            exit 1
          fi
          if pgrep -f '[t]hv serve' >/dev/null; then
            echo "Error: Default plugin build did not clean up its action-owned daemon"
            exit 1
          fi

      - name: Reject invalid push value during prerequisites
        id: invalid-plugin-push
        continue-on-error: true
        uses: ./ai-plugin-build
        with:
          path: ./test-plugin
          push: 'TRUE'

      - name: Verify invalid push value is rejected
        env:
          OUTCOME: ${{ steps.invalid-plugin-push.outcome }}
        run: |
          if [ "$OUTCOME" != "failure" ]; then
            echo "Error: Invalid plugin push value was not rejected"
            exit 1
          fi

      - name: Start ToolHive Daemon for Build Listing Checks
        id: plugin-daemon
        run: bash ./lib/daemon.sh start

      - name: Export Daemon URL for Later Steps
        env:
          DAEMON_URL: ${{ steps.plugin-daemon.outputs.url }}
        run: echo "TOOLHIVE_API_URL=$DAEMON_URL" >> "$GITHUB_ENV"

      - name: Verify Default Build Is Listed by Controlled Daemon
        env:
          REFERENCE: ${{ steps.plugin-build.outputs.reference }}
        run: |
          BUILDS=$(thv ai-plugin builds --format json)
          printf '%s\n' "$BUILDS"
          if ! printf '%s' "$BUILDS" | grep -Fq '"'$REFERENCE'"'; then
            echo "Error: default plugin build not found locally: $REFERENCE"
            exit 1
          fi

      - name: Test Build Action (multiple tags with blank and whitespace-only lines)
        id: plugin-build-multiple
        uses: ./ai-plugin-build
        with:
          path: ./test-plugin
          tags: "   \n\n  ghcr.io/stacklok/test-plugin:ci-one  \n\t \t\n\tghcr.io/stacklok/test-plugin:ci-two\t\n  "

      - name: Verify Multiple Build Outputs and Listing
        env:
          REFERENCE: ${{ steps.plugin-build-multiple.outputs.reference }}
          REFERENCES: ${{ steps.plugin-build-multiple.outputs.references }}
          EXPECTED_REFERENCE: ghcr.io/stacklok/test-plugin:ci-one
          EXPECTED_REFERENCES: |-
            ghcr.io/stacklok/test-plugin:ci-one
            ghcr.io/stacklok/test-plugin:ci-two
        run: |
          if [[ "$REFERENCE" == *$'\n'* || "$REFERENCE" == *$'\r'* ]]; then
            echo "Error: plugin reference output contains a line break"
            exit 1
          fi
          if [ "$REFERENCE" != "$EXPECTED_REFERENCE" ]; then
            echo "Error: plugin reference does not exactly match the first trimmed input reference"
            exit 1
          fi
          if [ "$REFERENCES" != "$EXPECTED_REFERENCES" ]; then
            echo "Error: plugin references did not preserve trimmed input order"
            exit 1
          fi

          BUILDS=$(thv ai-plugin builds --format json)
          printf '%s\n' "$BUILDS"
          while IFS= read -r BUILT_REFERENCE; do
            if ! printf '%s' "$BUILDS" | grep -Fq '"'$BUILT_REFERENCE'"'; then
              echo "Error: plugin build not found locally: $BUILT_REFERENCE"
              exit 1
            fi
          done <<< "$EXPECTED_REFERENCES"

      - name: Reject invalid plugin manifest before build
        id: invalid-plugin-manifest
        continue-on-error: true
        uses: ./ai-plugin-build
        with:
          path: ./ai-plugin-build/testdata/invalid-name
          tags: ghcr.io/stacklok/invalid-plugin:must-not-build

      - name: Verify invalid plugin manifest did not build
        env:
          OUTCOME: ${{ steps.invalid-plugin-manifest.outcome }}
        run: |
          if [ "$OUTCOME" != "failure" ]; then
            echo "Error: Invalid plugin manifest was not rejected"
            exit 1
          fi
          BUILDS=$(thv ai-plugin builds --format json)
          if printf '%s' "$BUILDS" | grep -Fq '"ghcr.io/stacklok/invalid-plugin:must-not-build"'; then
            echo "Error: Invalid plugin manifest was built before rejection"
            exit 1
          fi

      - name: Reject duplicate trimmed plugin tags
        id: duplicate-plugin-tags
        continue-on-error: true
        uses: ./ai-plugin-build
        with:
          path: ./test-plugin
          tags: "  ghcr.io/stacklok/test-plugin:duplicate  \n\tghcr.io/stacklok/test-plugin:duplicate\t"

      - name: Verify duplicate plugin tags are rejected
        env:
          OUTCOME: ${{ steps.duplicate-plugin-tags.outcome }}
        run: |
          if [ "$OUTCOME" != "failure" ]; then
            echo "Error: duplicate trimmed plugin tags were not rejected"
            exit 1
          fi

      - name: Stop Test ToolHive Daemon
        if: always()
        env:
          DAEMON_PID: ${{ steps.plugin-daemon.outputs.pid }}
          DAEMON_STARTED: ${{ steps.plugin-daemon.outputs.started }}
        run: bash ./lib/daemon.sh stop

  test-lockfile-actions:
    name: Test Lock File Actions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Create fake ToolHive environment
        run: |
          FAKE_BIN="${RUNNER_TEMP}/fake-toolhive-bin"
          PROJECT_ROOT="${RUNNER_TEMP}/toolhive-lockfile-test"
          mkdir -p "$FAKE_BIN" "$PROJECT_ROOT"

          cat > "$FAKE_BIN/curl" <<'CURL_SCRIPT'
          #!/usr/bin/env bash
          printf '204'
          CURL_SCRIPT

          cat > "$FAKE_BIN/thv" <<'THV_SCRIPT'
          #!/usr/bin/env bash
          set -u

          printf '%s\n' "$*" >> "$FAKE_THV_LOG"
          resource="${1:-}"
          command="${2:-}"

          has_flag() {
            local expected="$1"
            shift
            for argument in "$@"; do
              [ "$argument" != "$expected" ] || return 0
            done
            return 1
          }

          if [ "$command" = "sync" ]; then
            if [ "${FAKE_SYNC_DRIFT:-false}" = "true" ] && \
               ! has_flag --check "$@"; then
              printf 'unexpected restored content\n' > \
                "$FAKE_PROJECT_ROOT/untracked-restored.txt"
            fi
            exit 0
          fi

          if [ "$command" = "upgrade" ]; then
            if has_flag --fail-on-changes "$@"; then
              if [ "$resource" = "skill" ]; then
                printf '%s\n' \
                  '{"outcomes":[{"name":"test-skill","status":"upgraded"}]}'
                exit 2
              fi
              printf '%s\n' '{"outcomes":[]}'
              exit 0
            fi

            if [ "$resource" = "skill" ]; then
              printf 'updated skill content\n' > "$FAKE_PROJECT_ROOT/skill.txt"
            fi
            exit 0
          fi

          if [ "$resource" = "serve" ]; then
            exit 1
          fi

          echo "Unexpected fake thv command: $*" >&2
          exit 1
          THV_SCRIPT

          chmod +x "$FAKE_BIN/curl" "$FAKE_BIN/thv"
          : > "${RUNNER_TEMP}/fake-thv.log"

          printf 'version: 1\n' > "$PROJECT_ROOT/toolhive.lock.yaml"
          printf 'original skill content\n' > "$PROJECT_ROOT/skill.txt"
          git -C "$PROJECT_ROOT" init
          git -C "$PROJECT_ROOT" config user.name test
          git -C "$PROJECT_ROOT" config user.email test@example.com
          git -C "$PROJECT_ROOT" add .
          git -C "$PROJECT_ROOT" commit -m initial

          echo "$FAKE_BIN" >> "$GITHUB_PATH"
          echo "FAKE_PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"
          echo "FAKE_THV_LOG=${RUNNER_TEMP}/fake-thv.log" >> "$GITHUB_ENV"

      - name: Test lock file update
        id: update-lockfile
        uses: ./lockfile-update
        with:
          resources: all
          clients: claude-code
          project-root: ${{ runner.temp }}/toolhive-lockfile-test

      - name: Verify lock file update outputs
        env:
          UPDATES_AVAILABLE: ${{ steps.update-lockfile.outputs.updates-available }}
          SKILLS_UPDATES: ${{ steps.update-lockfile.outputs.skills-updates-available }}
          AI_PLUGINS_UPDATES: ${{ steps.update-lockfile.outputs.ai-plugins-updates-available }}
          UPDATED: ${{ steps.update-lockfile.outputs.updated }}
          SKILLS_PLAN_FILE: ${{ steps.update-lockfile.outputs.skills-plan-file }}
          AI_PLUGINS_PLAN_FILE: ${{ steps.update-lockfile.outputs.ai-plugins-plan-file }}
        run: |
          [ "$UPDATES_AVAILABLE" = "true" ]
          [ "$SKILLS_UPDATES" = "true" ]
          [ "$AI_PLUGINS_UPDATES" = "false" ]
          [ "$UPDATED" = "true" ]
          grep -Fq '"test-skill"' "$SKILLS_PLAN_FILE"
          grep -Fq '"outcomes":[]' "$AI_PLUGINS_PLAN_FILE"
          grep -Fq 'updated skill content' "$FAKE_PROJECT_ROOT/skill.txt"
          grep -Fq 'skill upgrade --fail-on-changes' "$FAKE_THV_LOG"
          grep -Fq 'ai-plugin upgrade --fail-on-changes' "$FAKE_THV_LOG"
          grep -Fq 'skill sync --check' "$FAKE_THV_LOG"
          grep -Fq 'ai-plugin sync --check' "$FAKE_THV_LOG"

      - name: Commit simulated update
        run: |
          git -C "$FAKE_PROJECT_ROOT" add .
          git -C "$FAKE_PROJECT_ROOT" commit -m update

      - name: Test successful lock file verification
        id: verify-lockfile
        uses: ./lockfile-verify
        with:
          resources: all
          clients: claude-code
          project-root: ${{ runner.temp }}/toolhive-lockfile-test

      - name: Verify successful result
        env:
          VERIFIED: ${{ steps.verify-lockfile.outputs.verified }}
        run: test "$VERIFIED" = "true"

      - name: Test drift detection
        id: verify-drift
        continue-on-error: true
        uses: ./lockfile-verify
        env:
          FAKE_SYNC_DRIFT: 'true'
        with:
          resources: skills
          clients: claude-code
          project-root: ${{ runner.temp }}/toolhive-lockfile-test

      - name: Verify drift is rejected
        env:
          OUTCOME: ${{ steps.verify-drift.outcome }}
        run: test "$OUTCOME" = "failure"

  test-daemon-lib:
    name: Test Shared Daemon Lifecycle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install ToolHive
        uses: ./install

      - name: Verify no ToolHive daemon is prestarted
        run: |
          HTTP_CODE=$(curl --silent --connect-timeout 1 --max-time 2 \
            -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/health 2>/dev/null || true)
          if [ "$HTTP_CODE" != "000" ] || pgrep -f '[t]hv serve' >/dev/null; then
            echo "Error: A ToolHive daemon was running before the lifecycle test"
            exit 1
          fi

      - name: Start an owned daemon
        id: owned
        run: bash ./lib/daemon.sh start

      - name: Verify the owned daemon is ready
        env:
          URL: ${{ steps.owned.outputs.url }}
          PID: ${{ steps.owned.outputs.pid }}
          STARTED: ${{ steps.owned.outputs.started }}
        run: |
          [ "$STARTED" = "true" ] || { echo "Error: expected started=true, got '$STARTED'"; exit 1; }
          if ! [[ "$URL" =~ ^http://127\.0\.0\.1:[0-9]+$ ]]; then
            echo "Error: unexpected daemon URL '$URL'"
            exit 1
          fi
          kill -0 "$PID" || { echo "Error: daemon process $PID is not running"; exit 1; }
          HTTP_CODE=$(curl --silent --max-time 2 -o /dev/null -w '%{http_code}' "$URL/health" || true)
          case "$HTTP_CODE" in
            204|503) ;;
            *) echo "Error: daemon health returned '$HTTP_CODE'"; exit 1 ;;
          esac

      - name: Reuse the running daemon
        id: reused
        env:
          TOOLHIVE_API_URL: ${{ steps.owned.outputs.url }}
        run: bash ./lib/daemon.sh start

      - name: Verify the daemon was reused, not restarted
        env:
          OWNED_URL: ${{ steps.owned.outputs.url }}
          URL: ${{ steps.reused.outputs.url }}
          PID: ${{ steps.reused.outputs.pid }}
          STARTED: ${{ steps.reused.outputs.started }}
        run: |
          [ "$STARTED" = "false" ] || { echo "Error: expected started=false, got '$STARTED'"; exit 1; }
          [ "$URL" = "$OWNED_URL" ] || { echo "Error: reused URL '$URL' differs from '$OWNED_URL'"; exit 1; }
          [ -z "$PID" ] || { echo "Error: reused daemon reported pid '$PID'"; exit 1; }
          COUNT=$(pgrep -f '[t]hv serve' | wc -l)
          [ "$COUNT" -eq 1 ] || { echo "Error: expected one thv serve process, found $COUNT"; exit 1; }

      - name: Stop a daemon this step did not start
        env:
          # A real PID with started=false must never be stopped.
          DAEMON_PID: ${{ steps.owned.outputs.pid }}
          DAEMON_STARTED: ${{ steps.reused.outputs.started }}
        run: bash ./lib/daemon.sh stop

      - name: Verify the daemon is still running
        env:
          URL: ${{ steps.owned.outputs.url }}
          PID: ${{ steps.owned.outputs.pid }}
        run: |
          kill -0 "$PID" || { echo "Error: daemon was stopped although started=false"; exit 1; }
          HTTP_CODE=$(curl --silent --max-time 2 -o /dev/null -w '%{http_code}' "$URL/health" || true)
          case "$HTTP_CODE" in
            204|503) ;;
            *) echo "Error: daemon health returned '$HTTP_CODE'"; exit 1 ;;
          esac

      - name: Stop the owned daemon
        env:
          DAEMON_PID: ${{ steps.owned.outputs.pid }}
          DAEMON_STARTED: ${{ steps.owned.outputs.started }}
        run: bash ./lib/daemon.sh stop

      - name: Verify the owned daemon stopped
        env:
          URL: ${{ steps.owned.outputs.url }}
          PID: ${{ steps.owned.outputs.pid }}
        run: |
          # A reaped process has no state; an unreaped one shows Z (zombie).
          STATE=$(ps -o stat= -p "$PID" 2>/dev/null || true)
          case "$STATE" in
            ""|Z*) ;;
            *) echo "Error: daemon process $PID is still running (state '$STATE')"; exit 1 ;;
          esac
          HTTP_CODE=$(curl --silent --max-time 2 -o /dev/null -w '%{http_code}' "$URL/health" || true)
          [ "$HTTP_CODE" = "000" ] || { echo "Error: daemon still answers with '$HTTP_CODE'"; exit 1; }

      - name: Start when TOOLHIVE_API_URL is unreachable
        id: fallback
        env:
          TOOLHIVE_API_URL: http://127.0.0.1:9
        run: bash ./lib/daemon.sh start

      - name: Verify a new daemon was started
        env:
          URL: ${{ steps.fallback.outputs.url }}
          STARTED: ${{ steps.fallback.outputs.started }}
        run: |
          [ "$STARTED" = "true" ] || { echo "Error: expected started=true, got '$STARTED'"; exit 1; }
          [ "$URL" != "http://127.0.0.1:9" ] || { echo "Error: unreachable URL was reused"; exit 1; }

      - name: Stop the fallback daemon
        if: always()
        env:
          DAEMON_PID: ${{ steps.fallback.outputs.pid }}
          DAEMON_STARTED: ${{ steps.fallback.outputs.started }}
        run: bash ./lib/daemon.sh stop

      - name: Start and stop without a working ps
        run: |
          # Minimal job containers may lack ps. Liveness must then fall back
          # to /proc or kill -0 instead of treating the daemon as dead.
          SHIM=$(mktemp -d)
          printf '#!/bin/sh\nexit 127\n' > "$SHIM/ps"
          chmod +x "$SHIM/ps"
          OUT=$(mktemp)
          PATH="$SHIM:$PATH" GITHUB_OUTPUT="$OUT" TOOLHIVE_API_URL=http://127.0.0.1:9 \
            timeout 60 bash ./lib/daemon.sh start
          PID=$(sed -n 's/^pid=//p' "$OUT")
          URL=$(sed -n 's/^url=//p' "$OUT")
          CODE=$(curl -s -o /dev/null -w '%{http_code}' "$URL/health" || true)
          case "$CODE" in
            204|503) ;;
            *) echo "Error: daemon not ready without ps (health $CODE)"; exit 1 ;;
          esac
          PATH="$SHIM:$PATH" DAEMON_PID="$PID" DAEMON_STARTED=true timeout 30 bash ./lib/daemon.sh stop
          CODE=$(curl -s -o /dev/null -w '%{http_code}' "$URL/health" || true)
          if [ "$CODE" != "000" ]; then
            echo "Error: daemon still answers after stop without ps (health $CODE)"
            exit 1
          fi

      - name: Reject TOOLHIVE_API_URL with a line break
        id: newline-url
        continue-on-error: true
        env:
          TOOLHIVE_API_URL: "http://127.0.0.1:8080\nstarted=false"
        run: bash ./lib/daemon.sh start

      - name: Verify the line break is rejected
        env:
          OUTCOME: ${{ steps.newline-url.outcome }}
        run: test "$OUTCOME" = "failure"

      - name: Reject an unknown command
        id: unknown-command
        continue-on-error: true
        run: bash ./lib/daemon.sh restart

      - name: Verify the unknown command is rejected
        env:
          OUTCOME: ${{ steps.unknown-command.outcome }}
        run: test "$OUTCOME" = "failure"

      - name: Clean Up
        if: always()
        run: pkill -f '[t]hv serve' || true

  test-skill-validate-action:
    name: Test Skill Validate Action (thv ${{ matrix.thv-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Oldest supported release (string lists only), the first release
        # with structured findings, and the newest release.
        thv-version: [v0.48.0, v0.67.0, latest]
    env:
      FIXTURES: skill-validate/testdata
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install ToolHive ${{ matrix.thv-version }}
        uses: ./install
        with:
          version: ${{ matrix.thv-version }}

      - name: Validate skills and plugins with warnings
        id: warnings
        uses: ./skill-validate
        with:
          # Overlapping entries are validated once; not-a-skill is skipped by
          # the glob.
          paths: |
            ${{ env.FIXTURES }}/skills/*
              ${{ env.FIXTURES }}/plugins/*/

            ./${{ env.FIXTURES }}/skills/valid-skill/

      - name: Verify outputs and report
        env:
          THV_VERSION: ${{ matrix.thv-version }}
          VALID: ${{ steps.warnings.outputs.valid }}
          ERROR_COUNT: ${{ steps.warnings.outputs.error-count }}
          WARNING_COUNT: ${{ steps.warnings.outputs.warning-count }}
          REPORT_FILE: ${{ steps.warnings.outputs.report-file }}
        run: |
          fail() { echo "Error: $*"; exit 1; }
          jq . "$REPORT_FILE"

          [ "$VALID" = "true" ] || fail "valid output is '$VALID'"
          [ "$ERROR_COUNT" = "0" ] || fail "error-count is '$ERROR_COUNT'"
          [ "$(jq -r .valid "$REPORT_FILE")" = "true" ] || fail "report is not valid"
          [ "$(jq '.results | length' "$REPORT_FILE")" = "5" ] || fail "expected 5 results"
          jq -e '[.results[].path] == [
              "skill-validate/testdata/skills/broken-refs",
              "skill-validate/testdata/skills/long-skill",
              "skill-validate/testdata/skills/valid-skill",
              "skill-validate/testdata/plugins/plugin-broken-ref",
              "skill-validate/testdata/plugins/valid-plugin"]' "$REPORT_FILE" >/dev/null \
            || fail "unexpected result paths"
          jq -e '[.results[].type] == ["skill", "skill", "skill", "plugin", "plugin"]' "$REPORT_FILE" >/dev/null \
            || fail "unexpected result types"
          jq -e '.results[] | select(.path | endswith("long-skill")) | .warnings | length == 1' "$REPORT_FILE" >/dev/null \
            || fail "long-skill should have one warning"

          if [ "$THV_VERSION" = "v0.48.0" ]; then
            [ "$WARNING_COUNT" = "1" ] || fail "warning-count is '$WARNING_COUNT', expected 1"
            jq -e 'all(.results[]; has("findings") | not)' "$REPORT_FILE" >/dev/null \
              || fail "v0.48.0 should not report findings"
            exit 0
          fi

          # v0.67.0 and later: structured findings with file and line.
          if [ "$THV_VERSION" = "v0.67.0" ]; then
            [ "$WARNING_COUNT" = "4" ] || fail "warning-count is '$WARNING_COUNT', expected 4"
          fi
          jq -e '.results[] | select(.path | endswith("broken-refs")) | .findings
            | any(.rule == "ref-unresolved" and .file == "SKILL.md" and .line == 8)
              and any(.rule == "script-direct-exec" and .file == "SKILL.md" and .line == 10)' \
            "$REPORT_FILE" >/dev/null || fail "broken-refs findings are missing"
          jq -e '.results[] | select(.path | endswith("plugin-broken-ref")) | .findings
            | any(.rule == "ref-unresolved" and .file == "skills/helper/SKILL.md" and .line == 8)' \
            "$REPORT_FILE" >/dev/null || fail "bundled skill finding is missing"
          jq -e '.results[] | select(.path | endswith("long-skill")) | .findings
            | any(.rule == "skill-md-too-long" and .line == 0)' \
            "$REPORT_FILE" >/dev/null || fail "skill-md-too-long finding is missing"

      - name: Verify the action stopped its daemon
        run: |
          if pgrep -f '[t]hv serve' >/dev/null; then
            echo "Error: skill-validate did not stop its daemon"
            exit 1
          fi

      - name: Fail on warnings when requested
        id: fail-on-warnings
        continue-on-error: true
        uses: ./skill-validate
        with:
          paths: ${{ env.FIXTURES }}/skills/long-skill
          fail-on-warnings: 'true'

      - name: Fail on invalid skills and plugins
        id: invalid
        continue-on-error: true
        uses: ./skill-validate
        with:
          paths: |
            ${{ env.FIXTURES }}/skills/valid-skill
            ${{ env.FIXTURES }}/invalid/long-description
            ${{ env.FIXTURES }}/invalid/invalid-plugin

      - name: Verify failing runs
        env:
          FAIL_ON_WARNINGS_OUTCOME: ${{ steps.fail-on-warnings.outcome }}
          FAIL_ON_WARNINGS_VALID: ${{ steps.fail-on-warnings.outputs.valid }}
          INVALID_OUTCOME: ${{ steps.invalid.outcome }}
          INVALID_VALID: ${{ steps.invalid.outputs.valid }}
          INVALID_ERROR_COUNT: ${{ steps.invalid.outputs.error-count }}
          INVALID_REPORT: ${{ steps.invalid.outputs.report-file }}
        run: |
          fail() { echo "Error: $*"; exit 1; }
          [ "$FAIL_ON_WARNINGS_OUTCOME" = "failure" ] || fail "warnings did not fail with fail-on-warnings"
          [ "$FAIL_ON_WARNINGS_VALID" = "true" ] || fail "warnings alone should keep valid=true"
          [ "$INVALID_OUTCOME" = "failure" ] || fail "invalid directories did not fail"
          [ "$INVALID_VALID" = "false" ] || fail "valid output is '$INVALID_VALID'"
          [ "$INVALID_ERROR_COUNT" = "3" ] || fail "error-count is '$INVALID_ERROR_COUNT', expected 3"
          jq -e '[.results[] | {path: (.path | split("/") | last), valid}] == [
              {path: "valid-skill", valid: true},
              {path: "long-description", valid: false},
              {path: "invalid-plugin", valid: false}]' "$INVALID_REPORT" >/dev/null \
            || fail "every directory should be validated, including after a failure"
          if pgrep -f '[t]hv serve' >/dev/null; then
            fail "a failing run did not stop its daemon"
          fi

      - name: Reject recursive glob
        id: recursive-glob
        continue-on-error: true
        uses: ./skill-validate
        with:
          paths: ${{ env.FIXTURES }}/**

      - name: Reject glob without skills or plugins
        id: empty-glob
        continue-on-error: true
        uses: ./skill-validate
        with:
          paths: ${{ env.FIXTURES }}/skills/not-*

      - name: Reject directory that is not a skill or plugin
        id: not-a-skill
        continue-on-error: true
        uses: ./skill-validate
        with:
          paths: ${{ env.FIXTURES }}/skills/not-a-skill

      - name: Reject directory with both markers
        id: both-markers
        continue-on-error: true
        uses: ./skill-validate
        with:
          paths: ${{ env.FIXTURES }}/invalid/both-markers

      - name: Reject missing directory
        id: missing
        continue-on-error: true
        uses: ./skill-validate
        with:
          paths: ${{ env.FIXTURES }}/skills/does-not-exist

      - name: Reject blank paths
        id: blank
        continue-on-error: true
        uses: ./skill-validate
        with:
          paths: "  \n\t\n"

      - name: Reject invalid fail-on-warnings value
        id: bad-flag
        continue-on-error: true
        uses: ./skill-validate
        with:
          paths: ${{ env.FIXTURES }}/skills/valid-skill
          fail-on-warnings: 'TRUE'

      - name: Verify rejected inputs
        env:
          OUTCOMES: >-
            recursive-glob=${{ steps.recursive-glob.outcome }}
            empty-glob=${{ steps.empty-glob.outcome }}
            not-a-skill=${{ steps.not-a-skill.outcome }}
            both-markers=${{ steps.both-markers.outcome }}
            missing=${{ steps.missing.outcome }}
            blank=${{ steps.blank.outcome }}
            bad-flag=${{ steps.bad-flag.outcome }}
        run: |
          FAILED=false
          for ENTRY in $OUTCOMES; do
            if [ "${ENTRY#*=}" != "failure" ]; then
              echo "Error: ${ENTRY%%=*} was not rejected (outcome: ${ENTRY#*=})"
              FAILED=true
            fi
          done
          $FAILED && exit 1
          if pgrep -f '[t]hv serve' >/dev/null; then
            echo "Error: a rejected run left a daemon running"
            exit 1
          fi
          echo "All invalid inputs were rejected."

  lint-shell:
    name: Lint Shared Shell Scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run shellcheck
        run: |
          # Preinstalled on GitHub-hosted Ubuntu; install it on other images.
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update -q && sudo apt-get install -y -q shellcheck
          fi
          shellcheck --version
          shellcheck lib/*.sh skill-validate/*.sh

  validate-action-metadata:
    name: Validate Action Metadata
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup yq
        uses: mikefarah/yq@v4

      - name: Validate install/action.yml
        run: |
          echo "Validating install/action.yml..."
          yq eval '.' install/action.yml > /dev/null
          echo "✓ install/action.yml is valid"

      - name: Validate run-mcp-server/action.yml
        run: |
          echo "Validating run-mcp-server/action.yml..."
          yq eval '.' run-mcp-server/action.yml > /dev/null
          echo "✓ run-mcp-server/action.yml is valid"

      - name: Validate mcp-config/action.yml
        run: |
          echo "Validating mcp-config/action.yml..."
          yq eval '.' mcp-config/action.yml > /dev/null
          echo "✓ mcp-config/action.yml is valid"

      - name: Validate skill-build/action.yml
        run: |
          echo "Validating skill-build/action.yml..."
          yq eval '.' skill-build/action.yml > /dev/null
          echo "✓ skill-build/action.yml is valid"

      - name: Validate ai-plugin-build/action.yml
        run: |
          echo "Validating ai-plugin-build/action.yml..."
          yq eval '.' ai-plugin-build/action.yml > /dev/null
          echo "✓ ai-plugin-build/action.yml is valid"

      - name: Validate lockfile-update/action.yml
        run: |
          echo "Validating lockfile-update/action.yml..."
          yq eval '.' lockfile-update/action.yml > /dev/null
          echo "✓ lockfile-update/action.yml is valid"

      - name: Validate lockfile-verify/action.yml
        run: |
          echo "Validating lockfile-verify/action.yml..."
          yq eval '.' lockfile-verify/action.yml > /dev/null
          echo "✓ lockfile-verify/action.yml is valid"

      - name: Validate skill-validate/action.yml
        run: |
          echo "Validating skill-validate/action.yml..."
          yq eval '.' skill-validate/action.yml > /dev/null
          echo "✓ skill-validate/action.yml is valid"
